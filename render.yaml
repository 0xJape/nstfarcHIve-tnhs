databases:
  - name: archive-operational-db
    plan: free
    databaseName: archive
    user: archive

services:
  - type: web
    name: archive-api
    runtime: python
    plan: free
    rootDir: arcHIVe-main
    buildCommand: pip install -r requirements-api.txt
    startCommand: python -m src.phase2_runtime_api --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ARCHIVE_CORS_ORIGIN
        sync: false
      - key: ARCHIVE_PUBLIC_URL
        sync: false
      - key: ARCHIVE_ADMIN_USERNAME
        sync: false
      - key: ARCHIVE_ADMIN_PASSWORD
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: TTS_MODEL
        value: canopylabs/orpheus-v1-english
      - key: TTS_VOICE
        value: autumn
      - key: DATABASE_URL
        fromDatabase:
          name: archive-operational-db
          property: connectionString
